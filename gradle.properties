# Configuração de Memória Unificada da JVM para Compilação Estável
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Desativação do Daemon do Gradle e Concorrência de Workers
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# Estratégia de Compilação do Kotlin em Processo Único (Evita estouro de memória no CI)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m

# Suporte ao AndroidX e Jetifier
android.useAndroidX=true
android.enableJetifier=true
