# Limite rígido de memória para o ambiente do GitHub Actions
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Desativação de daemons e threads paralelas para garantir estabilidade
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false

# Compilação síncrona do Kotlin
kotlin.compiler.execution.strategy=in-process

# Suporte ao AndroidX
android.useAndroidX=true
android.enableJetifier=true
