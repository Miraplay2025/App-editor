# Configuração Unificada e Segura de Memória para o GitHub Actions
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Desativação de Daemons e Paralelismo para Garantir Compilação Estável
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false

# Estratégia do Compilador Kotlin (Roda no mesmo processo, evitando travamentos no final do build)
kotlin.compiler.execution.strategy=in-process

# Compatibilidade com AndroidX
android.useAndroidX=true
android.enableJetifier=true
