name: Build e Assinatura do APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clona o repositório
    - name: Clonar Repositório
      uses: actions/checkout@v4.2.2

    # 2. Limpa resíduos temporários e diretórios
    - name: Limpar Caches e Resíduos Anteriores
      run: |
        rm -rf ~/.gradle
        rm -rf ~/.m2
        rm -rf app/build
        rm -rf build
        rm -rf .gradle

    # 3. Configura o ambiente Java JDK 17
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. Configura o Gradle com a action oficial
    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    # 5. Configura parâmetros de memória do Gradle
    - name: Configurar Parâmetros de Memória do Gradle
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties

    # 6. Gera a Keystore de Assinatura Digital no local exato do app
    - name: Gerar Keystore de Assinatura Digital do APK
      run: |
        keytool -genkeypair -v \
          -keystore app/keystore.jks \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=AutoVideoEditor, OU=Dev, O=App, L=City, S=State, C=BR"

    # 7. Compila o APK Release assinado
    - name: Compilar APK Release Assinado
      env:
        KEYSTORE_FILE: "keystore.jks"
        KEYSTORE_PASSWORD: "android"
        KEY_ALIAS: "androidkey"
        KEY_PASSWORD: "android"
      run: gradle assembleRelease --refresh-dependencies --no-daemon --stacktrace

    # 8. Salva o APK final nos Artefatos
    - name: Salvar APK em Artefato para Download
      uses: actions/upload-artifact@v4
      with:
        name: AutoVideoEditor-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
