name: Build e Assinatura do APK Android

# Execução estritamente manual via interface do GitHub (Workflow Dispatch)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Atualizado para versão mais recente compatível com os runners atuais
    - name: Clonar Repositório
      uses: actions/checkout@v4.2.2

    # Configuração do Java JDK 17 com a versão mais recente da action
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gerar Keystore de Assinatura Digital do APK
      run: |
        keytool -genkeypair -v \
          -keystore app/keystore.jks \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=AutoVideoEditor, OU=Dev, O=App, L=City, S=State, C=BR"

    - name: Dar permissão de execução ao Gradle Wrapper
      run: chmod +x gradlew

    # Executa o build sem o daemon do Gradle para estabilidade em ambientes de CI/CD
    - name: Compilar APK Release Assinado
      env:
        KEYSTORE_FILE: "keystore.jks"
        KEYSTORE_PASSWORD: "android"
        KEY_ALIAS: "androidkey"
        KEY_PASSWORD: "android"
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Salvar APK em Artefato para Download
      uses: actions/upload-artifact@v4
      with:
        name: AutoVideoEditor-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
