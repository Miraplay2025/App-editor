name: Build e Assinatura do APK Android

# Execução estritamente manual via interface do GitHub (Aba Actions -> Run workflow)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clona o repositório atual
    - name: Clonar Repositório
      uses: actions/checkout@v4.2.2

    # 2. Configura o ambiente Java JDK 17 (Removido cache problemático para evitar erro de chave)
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Configura opções de memória e estabilidade do Gradle para o ambiente CI
    - name: Configurar Parâmetros de Memória do Gradle
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties

    # 4. Gera a Keystore de Assinatura Digital para permitir a instalação no Android sem alertas
    - name: Gerar Keystore de Assinatura Digital do APK
      run: |
        keytool -genkeypair -v \
          -keystore app/keystore.jks \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=AutoVideoEditor, OU=Dev, O=App, L=City, S=State, C=BR"

    # 5. Concede permissão de execução ao wrapper do Gradle
    - name: Dar permissão de execução ao Gradle Wrapper
      run: chmod +x gradlew

    # 6. Compila o APK Release assinado com log detalhado de erros
    - name: Compilar APK Release Assinado
      env:
        KEYSTORE_FILE: "keystore.jks"
        KEYSTORE_PASSWORD: "android"
        KEY_ALIAS: "androidkey"
        KEY_PASSWORD: "android"
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    # 7. Disponibiliza o arquivo APK gerado na seção de Artefatos do GitHub Actions
    - name: Salvar APK em Artefato para Download
      uses: actions/upload-artifact@v4
      with:
        name: AutoVideoEditor-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
