name: Build e Assinatura do APK Android

# Execução estritamente manual via interface do GitHub (Aba Actions -> Run workflow)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clona o repositório atual
    - name: Clonar Repositório
      uses: actions/checkout@v4.2.2

    # 2. Configura o ambiente Java JDK 17
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Configura a ferramenta Gradle automaticamente no ambiente CI
    - name: Configurar Gradle
      uses: gradle/gradle-build-action@v3

    # 4. Configura parâmetros de memória do Gradle para evitar erros de compilação
    - name: Configurar Parâmetros de Memória do Gradle
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties

    # 5. Gera a Keystore de Assinatura Digital para instalação segura no Android
    - name: Gerar Keystore de Assinatura Digital do APK
      run: |
        keytool -genkeypair -v \
          -keystore app/keystore.jks \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=AutoVideoEditor, OU=Dev, O=App, L=City, S=State, C=BR"

    # 6. Compila o APK Release assinado utilizando o Gradle do sistema
    - name: Compilar APK Release Assinado
      env:
        KEYSTORE_FILE: "keystore.jks"
        KEYSTORE_PASSWORD: "android"
        KEY_ALIAS: "androidkey"
        KEY_PASSWORD: "android"
      run: gradle assembleRelease --no-daemon --stacktrace

    # 7. Salva o arquivo APK gerado nos Artefatos para download
    - name: Salvar APK em Artefato para Download
      uses: actions/upload-artifact@v4
      with:
        name: AutoVideoEditor-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
