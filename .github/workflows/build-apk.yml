name: Build e Assinatura do APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clona o repositório
    - name: Clonar Repositório
      uses: actions/checkout@v4.2.2

    # 2. Limpa resíduos temporários e caches antigos
    - name: Limpar Caches e Resíduos Anteriores
      run: |
        rm -rf ~/.gradle
        rm -rf ~/.m2
        rm -rf app/build
        rm -rf build
        rm -rf .gradle

    # 3. Configura o ambiente Java JDK 17
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. Garantir existência do Gradle Wrapper
    - name: Garantir Existência do Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew não encontrado. Gerando Wrapper automaticamente..."
          gradle wrapper --gradle-version 8.5
        fi

    # 5. Dá permissão de execução ao Wrapper
    - name: Dar Permissão de Execução ao Gradle Wrapper
      run: chmod +x gradlew

    # 6. Gera a Keystore de Assinatura Digital do APK
    - name: Gerar Keystore de Assinatura Digital
      run: |
        keytool -genkeypair -v \
          -keystore app/keystore.jks \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=AutoVideoEditor, OU=Dev, O=App, L=City, S=State, C=BR"

    # 7. Compila o APK com a estratégia In-Process ativada
    - name: Compilar APK Release Assinado
      run: ./gradlew assembleRelease --no-daemon --max-workers=1 -Dkotlin.compiler.execution.strategy=in-process --stacktrace --info

    # 8. Salva o APK gerado nos Artefatos do GitHub
    - name: Salvar APK em Artefato para Download
      uses: actions/upload-artifact@v4
      with:
        name: AutoVideoEditor-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
